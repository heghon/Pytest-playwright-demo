[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --tb=short --strict-markers --html=reports/report.html --self-contained-html --css=assets/report_dark.css --screenshot=only-on-failure --video=retain-on-failure --tracing=retain-on-failure
; -ra -> at the end of the run, print a short summary line for anything that wasn't a plain pass (failures, errors, skips).
; --tb=short -> Trims the tracebacks to a more readable, shorter format
; --strict-markers -> Makes pytest error out if you use a marker name that isn't explicitly declared, instead of silently accepting it.
; --html -> where to write the report
; --self-contained-html -> bundle all CS/JS into one file for simplicity
; --css -> extra stylesheet appended after pytest-html's own: artifact styling + a dark theme that follows the OS setting
; --screeshot -> pytest-playwright built-in option to capture a screenshot when a fail happens
; --video -> Records video of the entire test run, but automatically deletes it if the test passes, keeping it only when something failed
; --tracing -> Playwright's most powerful debugging tool, a "trace" capturing a full timeline of actions, network requests, DOM snapshots and console logs 
markers =
    ui: End-to-end UI tests
    scraping: Web scraping tests
    automation: User flow automation tests