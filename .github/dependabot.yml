version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Minor and patch bumps travel together in one weekly PR. A major bump is
    # left out of the group on purpose, so it arrives in a PR of its own: that
    # is where breaking changes happen, so that is a better way of handling things.
    groups:
      python-packages:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"