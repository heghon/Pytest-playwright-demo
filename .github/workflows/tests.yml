name: Playwright Tests

# ──────────────────────────────────────────────────────────────────────────────
# What starts this workflow.
#
# Two are live: starting it by hand, and a pull request — and a pull request only
# does anything when Dependabot opened it (see the job conditions below). The
# rest are written out but commented, so switching one on is a matter of removing
# the #, not looking anything up. At least one trigger has to stay uncommented.
# ──────────────────────────────────────────────────────────────────────────────
on:
  # LIVE — start it yourself: Actions → Playwright Tests → Run workflow.
  # The only trigger that lets you pick an engine, and the only one that
  # publishes to Pages (the deploy job also insists on the main branch).
  workflow_dispatch:
    inputs:
      browser:
        description: "Engine to run the suite on"
        type: choice
        default: chromium
        options:
          # A choice option is its own value, so these read as browser names and
          # the step below maps them back to flags. chromium/firefox/webkit are
          # Playwright's own builds — webkit is the engine behind Safari, which
          # Playwright cannot drive directly. chrome and msedge are the branded
          # browsers, reached through --browser-channel.
          - chromium
          - chrome
          - firefox
          - webkit (safari)
          - msedge

  # LIVE — but only Dependabot's own pull requests get past the job conditions.
  # It is how a bump that cannot even be installed gets caught before merging,
  # which is exactly how some breakage reached main once.
  pull_request:

  # Every push to main no matter where it comes from.
  # push:
  #   branches: [main]

  # Only pushes that touch something able to change the outcome — no run for a
  # README typo. Combine with the branches filter above.
  # push:
  #   branches: [main]
  #   paths:
  #     - "stepdefs/**"
  #     - "pages/**"
  #     - "features/**"
  #     - "utils/**"
  #     - "requirements.txt"
  #     - "pytest.ini"
  #     - ".github/workflows/**"

  # A nightly run, to catch the sites under test changing under you rather than
  # your own code breaking. cron is UTC and has no timezone setting, so 06:00
  # here is 08:00 in Paris in summer and 07:00 in winter (for example). Two more catches:
  # scheduled runs can be delayed when GitHub is busy, and GitHub disables them
  # after 60 days without repository activity.
  # schedule:
  #   - cron: "0 6 * * *"          # daily
  #   - cron: "0 6 * * 1"          # or weekly, Monday morning

  # When a tag is pushed — a release smoke test rather than a routine one.
  # push:
  #   tags: ["v*"]

  # When a GitHub release is published, if you cut releases from the UI.
  # release:
  #   types: [published]

  # After another workflow finishes, e.g. running the suite against whatever a
  # deploy workflow just shipped. Named by workflow, not by file.
  # workflow_run:
  #   workflows: ["Deploy"]
  #   types: [completed]

  # Fired by an API call, so something outside GitHub can start a run — a deploy
  # pipeline, or a Jira automation once an issue moves to "Ready for test":
  #   curl -X POST -H "Authorization: token <PAT>" \
  #     https://api.github.com/repos/heghon/Pytest-playwright-demo/dispatches \
  #     -d '{"event_type":"run-tests"}'
  # repository_dispatch:
  #   types: [run-tests]

  # While a pull request sits in a merge queue, if you ever enable one.
  # merge_group:

# Least privilege plus what Pages needs: pages to publish, id-token so
# deploy-pages can mint its OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One run at a time per branch. Keyed on the ref so a pull request never queues
# behind main, and not cancel-in-progress: a half-published site is worse than a
# slightly stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs first and on its own, because it is the check that would have caught
  # the broken bump: it needs no secrets and no browsers, so it reports in well
  # under a minute and works even on a Dependabot pull request, which by default
  # gets none of this repository's secrets.
  dependencies:
    name: Check the pinned dependencies resolve
    # On a pull request this is for Dependabot alone — one of ours does nothing
    # at all. Every other trigger runs it normally.
    if: ${{ github.event_name != 'pull_request' || github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Dependencies · Check out the repository
        uses: actions/checkout@v7

      - name: Dependencies · Install Python
        uses: actions/setup-python@v7
        with:
          # The interpreter is pinned once, in .python-version, which is also
          # what pyenv reads locally. Hardcoding it here too meant CI could drift
          # from the version you actually develop against, silently.
          python-version-file: .python-version

      # --dry-run resolves the whole graph and downloads nothing. A pin that
      # contradicts what a parent package allows — pyee past the range playwright
      # accepts, say — fails here instead of halfway through a real install.
      - name: Dependencies · Resolve requirements.txt without installing
        run: pip install --dry-run -r requirements.txt

      # requirements.txt is generated from requirements.in. If someone edits the
      # .in and forgets to recompile, the lock silently stops matching its source.
      #
      # The recompile has to start from a copy of the current lock: pip-compile
      # treats an existing output file as preferences and keeps any pin that is
      # still valid. Compiling from nothing would instead pick the newest release
      # of everything, and the check would fail every time upstream published
      # anything — which is a different question from "is the lock in sync".
      - name: Dependencies · Confirm requirements.txt matches requirements.in
        run: |
          pip install pip-tools
          cp requirements.txt /tmp/recompiled.txt
          pip-compile --quiet --strip-extras --output-file=/tmp/recompiled.txt requirements.in
          if ! diff -q <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/recompiled.txt) > /dev/null; then
            echo "::error::requirements.txt is out of date — run 'pip-compile --strip-extras requirements.in' and commit the result."
            diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/recompiled.txt) || true
            exit 1
          fi

  # Setup, test and report stay in one job on purpose: every job gets its own
  # fresh runner, so splitting them would mean re-checking-out and
  # re-installing the browsers each time, then shuttling the report between
  # machines as an artifact. The step names below carry the phases instead —
  # the Actions UI already times and folds each one separately.
  test:
    name: Run the tests suite and build the report
    # Nothing here can work if the lock does not resolve — this job would only
    # reach the same pip install and fail there, after spending a couple of
    # minutes downloading a browser first. Waiting costs the length of the
    # dependencies job on a good run and saves the browser download on a bad one.
    needs: dependencies
    # Never on a pull request, Dependabot's included. Dependabot is handed a
    # separate secret store, so DOTENV arrives empty and the suite would fail on
    # a missing login rather than on anything the bump did, the dependencies
    # job above is the check that means something there. One of your own pull
    # requests does nothing either, by the same rule as that job.
    #
    # Left as a condition rather than dropped, so that switching on push or
    # schedule above is all it takes to get the suite running again.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      published: ${{ steps.bundle.outputs.ready }}

    steps:
      - name: Setup · Check out the repository
        uses: actions/checkout@v7

      - name: Setup · Install Python
        uses: actions/setup-python@v7
        with:
          # The interpreter is pinned once, in .python-version, which is also
          # what pyenv reads locally. Hardcoding it here too meant CI could drift
          # from the version you actually develop against, silently.
          python-version-file: .python-version

      - name: Setup · Install the pinned Python dependencies
        run: pip install -r requirements.txt

      # Splits the dropdown choice into what pytest-playwright wants: an engine
      # for --browser, plus a channel for --browser-channel when the choice was
      # a branded browser. Empty on push and pull_request, where there is no
      # input at all, so those keep running chromium.
      - name: Setup · Work out which engine to run
        env:
          BROWSER: ${{ inputs.browser || 'chromium' }}
        run: |
          case "$BROWSER" in
            "webkit (safari)") ENGINE=webkit;   CHANNEL= ;;
            chrome|msedge)     ENGINE=chromium; CHANNEL=$BROWSER ;;
            *)                 ENGINE=$BROWSER; CHANNEL= ;;
          esac
          echo "ENGINE=$ENGINE" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          # playwright install takes the branded browser if there is one
          echo "INSTALL=${CHANNEL:-$ENGINE}" >> "$GITHUB_ENV"

      # Only the engine being tested, rather than all three: a run uses exactly
      # one, and the download is the slowest step in the job.
      - name: Setup · Install the Playwright browser and its system libraries
        run: playwright install --with-deps "$INSTALL"

      # Read by conftest.py, which turns it into a one-click trace-viewer link
      # per failure. Derived from GITHUB_REPOSITORY rather than hardcoded, so a
      # fork publishes to its own Pages site instead of pointing at this one.
      - name: Setup · Work out where the report will be published
        run: |
          echo "REPORT_BASE_URL=https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      # One secret holding the whole file, instead of one workflow entry per
      # variable. conftest.py already calls load_dotenv(), so a variable added
      # to the DOTENV secret reaches the tests without touching this file — and
      # CI reads its configuration exactly the way a local run does.
      # The secret goes through env: rather than straight into run:, so its
      # contents are never spliced into the shell as code.
      - name: Setup · Write the .env file from the DOTENV secret
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          if [ -z "$DOTENV" ]; then
            echo "::error::The DOTENV secret is empty or missing — it should hold the whole .env file, see .env.example."
            exit 1
          fi
          printf '%s\n' "$DOTENV" > .env

      - name: Tests · Run the Playwright test suite
        run: |
          if [ -n "$CHANNEL" ]; then
            pytest --browser "$ENGINE" --browser-channel "$CHANNEL"
          else
            pytest --browser "$ENGINE"
          fi

      # No assembling left to do: --output puts the failure artifacts under
      # reports/ and --html names the report index.html, so the folder pytest
      # produces is already the publishable site — and already the layout every
      # path in the report is written against. This step only checks there is
      # something to publish.
      - name: Report · Check the report was produced
        id: bundle
        if: always()
        run: |
          if [ ! -f reports/index.html ]; then
            echo "The run produced no report — leaving the published one alone."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Both uploads wait on a bundle actually existing. Publishing an empty
      # site would replace the last good report with a 404 — worse than keeping
      # a stale one around.
      - name: Report · Upload the bundle as a downloadable artifact
        if: ${{ always() && steps.bundle.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: reports/
          retention-days: 7

      - name: Report · Hand the bundle to GitHub Pages
        if: ${{ always() && steps.bundle.outputs.ready == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports/

  # Its own job because a Pages deployment needs the github-pages environment,
  # which is granted per job — not because of the fresh runner.
  deploy:
    name: Publish the report to GitHub Pages
    needs: test
    # When the suite carries a deliberately failing scenario, test is red on every
    # run, but publish anyway. A failed run is exactly the one worth reading.
    #
    # Gated on the branch rather than the event. What must not happen is a run
    # from somewhere other than main overwriting the published report — a pull
    # request, or a manual run started against a side branch. Asking for a push
    # instead also ruled out running the workflow by hand on main, which is the
    # one case where you have deliberately picked an engine and want to see the
    # result. Those runs still leave the report as a downloadable artifact.
    if: ${{ !cancelled() && needs.test.outputs.published == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy · Publish the bundle to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
