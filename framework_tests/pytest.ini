[pytest]
; Unit tests of the framework itself: the report hooks, the API helpers, the
; schema validation, the venv check. They are one of the gates python check.py
; runs; on their own:
;
;     pytest framework_tests
;
; pytest takes its configuration from the nearest pytest.ini above the paths it
; is given, so pointing it at this folder reads this file and not the root one.
; That is the whole reason it exists: the root addopts would write these tests
; into reports/index.html over the scenarios, and start Playwright's recording
; for tests that never open a browser. A plain `pytest` never comes here either,
; because the root file's testpaths only lists stepdefs.
pythonpath = ..
testpaths = .
addopts = -ra --tb=short --strict-markers
; The one marker these tests create themselves, checking the tag-to-mark hook.
markers =
    jira_key: Linked JIRA issue key
